<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ltx</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="bar">
  <nav id="tabs"></nav>
  <span id="save-state">Saved</span>
  <span class="sep"></span>
  <button id="outline" title="Sections and word counts">Outline</button>
  <button id="comments" title="Your comments for Claude">Comments<span id="cmt-n" class="badge" hidden></span></button>
  <button id="justify" title="Justify text">Justify</button>
  <span class="sep"></span>
  <button id="pdf-err" hidden>PDF build failed</button>
  <span id="compile-state"></span>
  <button id="rebuild" title="Rebuild the PDF now">Rebuild</button>
  <button id="zoom-out" title="Zoom out">−</button>
  <button id="zoom-in" title="Zoom in">+</button>
  <label class="sl" title="Text size (view only)">Aa <input id="fs" type="range" min="12" max="24" step="1" value="17"></label>
  <label class="sl" title="Column width as % of the screen width (view only)">&harr; <input id="cw" type="range" min="50" max="100" step="1" value="100"></label>
  <button id="export" title="Copy the full LaTeX source to the clipboard">Export</button>
  <button id="latex" title="Show or hide the LaTeX markup">LaTeX</button>
  <button id="pdf" title="Show or hide the PDF">PDF</button>
  <button id="help" aria-label="Help: buttons, keys and marks" aria-expanded="false" aria-controls="help-panel">?</button>
</header>
<div id="help-panel" role="tooltip" hidden></div>
<div id="conn" hidden>Disconnected from the ltx server, retrying…</div>
<main>
  <section id="editor-pane">
    <div id="banner" hidden></div>
    <div id="replaced" hidden></div>
    <div id="sheets"></div>
  </section>
  <div id="split"></div>
  <section id="pdf-pane">
    <div id="errors" hidden></div>
    <div id="pdf-scroll"></div>
  </section>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
