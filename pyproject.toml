[project]
name = "latex-editor"
version = "0.1.0"
description = "ltx: local browser editor for LaTeX papers, co-edited with Claude"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
    "watchfiles>=0.24",
]

[project.scripts]
ltx = "ltx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltx"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://danieldager.github.io/ltx/"
Repository = "https://github.com/danieldager/ltx"
